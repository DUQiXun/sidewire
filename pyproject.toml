[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sidewire"
version = "1.0.0"
description = "Let an AI agent on one machine drive another machine on the same LAN. No SSH, no HTTP, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DUQiXun" }]
keywords = ["mcp", "model-context-protocol", "remote", "lan", "agent", "linux", "windows"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
sidewire = "sidewire.cli:main"

[project.urls]
Homepage = "https://github.com/DUQiXun/sidewire"
Source = "https://github.com/DUQiXun/sidewire"

[tool.setuptools]
packages = ["sidewire", "sidewire.mcp"]

[tool.setuptools.package-data]
sidewire = ["py.typed"]
